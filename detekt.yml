complexity:
  LongMethod:
    threshold: 60
  LongParameterList:
    functionThreshold: 10
    constructorThreshold: 10
  TooManyFunctions:
    thresholdInFiles: 20
    thresholdInClasses: 20

naming:
  FunctionNaming:
    ignoreAnnotated:
      - "Composable"

style:
  MaxLineLength:
    maxLineLength: 120
  MagicNumber:
    active: false
  ReturnCount:
    max: 5
  WildcardImport:
    active: true

formatting:
  ImportOrdering:
    active: false
